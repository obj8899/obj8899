name: Profile Summary Cards

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2

      # NOTE: this action only publishes a moving "release" branch, not version tags.
      # For strict pinning, replace "release" with the commit SHA shown at
      # https://github.com/vn7n24fzkq/github-profile-summary-cards/tree/release
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
